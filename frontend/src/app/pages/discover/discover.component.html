<gf-top-nav></gf-top-nav>

<!-- Map canvas -->
<main class="fixed top-16 left-0 right-0 bottom-0 bg-surface overflow-hidden">
  <div #mapEl class="w-full h-full"></div>

  <!-- Map controls -->
  <div class="absolute right-8 bottom-44 z-[500] flex flex-col gap-2">
    <button (click)="zoom(1)" class="w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center text-primary-container hover:bg-slate-50 transition-all"><span class="material-symbols-outlined">add</span></button>
    <button (click)="zoom(-1)" class="w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center text-primary-container hover:bg-slate-50 transition-all"><span class="material-symbols-outlined">remove</span></button>
  </div>
  <button class="absolute right-8 bottom-28 z-[500] bg-primary text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-3 hover:bg-primary-container transition-all active:scale-95">
    <span class="material-symbols-outlined text-[20px]">help_center</span>
    <span class="font-bold text-sm">Help?</span>
  </button>

  <!-- Trending carousel -->
  <div class="absolute bottom-8 left-8 right-32 z-[500]">
    <p class="font-label-caps text-label-caps text-primary-container mb-2 uppercase bg-white/70 backdrop-blur-sm inline-block px-2 py-1 rounded">Trending now</p>
    <div class="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
      @for (c of trending; track c.code) {
        <button (click)="open(c.code)"
          class="bg-white/90 backdrop-blur-md p-4 rounded-xl border border-white/50 shadow-xl flex items-center gap-4 w-64 flex-shrink-0 cursor-pointer hover:bg-white transition-all hover:-translate-y-1 text-left">
          <div class="w-12 h-12 rounded-lg bg-slate-200 overflow-hidden flex-shrink-0">
            <img class="w-full h-full object-cover" [src]="c.image" [alt]="c.name" />
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs">{{ c.flag }}</span>
              <span class="font-bold text-primary-container text-sm">{{ c.name }}</span>
            </div>
            <span class="text-[10px] text-slate-400 block uppercase tracking-widest font-bold">From ${{ c.cheapestFlight }}</span>
          </div>
        </button>
      }
    </div>
  </div>
</main>
